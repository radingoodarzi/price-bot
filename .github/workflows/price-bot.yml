name: price-bot

on:
  # GitHub's own timer is best-effort: on a new repo it can stay silent for hours, and runs at
  # minute :00 are the first to be dropped. Off-peak minutes help; the reliable trigger is an
  # external cron (cron-job.org) calling workflow_dispatch — see README.
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "همین حالا پست کن (بدون توجه به ساعت‌ها)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: price-bot
  cancel-in-progress: false

jobs:
  run:
    # never run (and never expose secrets) in forks or copies of this repo
    if: github.repository_owner == 'radingoodarzi'
    runs-on: ubuntu-latest
    timeout-minutes: 15  # room for source retries
    permissions:
      contents: write   # only to commit state.json
    env:
      FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v4
        with:
          # tip of main at run time, not the commit that triggered a queued run:
          # otherwise a queued run reads an old state.json and posts the same slot twice
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - run: pip install -r bot/requirements.txt

      - name: Is a post due?
        id: check
        run: python bot/main.py --check

      - name: Install browser
        if: steps.check.outputs.due == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Build image and post
        if: steps.check.outputs.due == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot/main.py --run

      - name: Save state
        if: always() && steps.check.outputs.due == 'true'
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "bot: update state"
            git pull --rebase
            git push
          fi
