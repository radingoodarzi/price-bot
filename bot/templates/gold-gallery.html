<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Vazir"; src: url(data:font/woff2;base64,{{ font }}) format("woff2"); font-weight: 100 900; }
* { margin: 0; padding: 0; box-sizing: border-box; letter-spacing: 0; }
body { width: {{ t.width }}px; height: {{ t.height }}px; position: relative; overflow: hidden;
  background: url(data:image/png;base64,{{ bg }}) no-repeat 0 0 / {{ t.width }}px {{ t.height }}px;
  font-family: "Vazir", sans-serif; }
.f { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; direction: ltr; unicode-bidi: isolate;
  line-height: 1; font-weight: 800; text-align: center; }
.num { font-size: {{ t.price.font_size }}px;
  background: linear-gradient(180deg, #fff1bf 0%, #f3cf7a 45%, #d9a441 100%); -webkit-background-clip: text; background-clip: text;
  color: transparent; filter: drop-shadow(0 3px 2px rgba(0,0,0,.55)); }
.meta { font-weight: 700; color: #f3d99a; filter: drop-shadow(0 2px 1px rgba(0,0,0,.6)); }
</style>
</head>
<body>
{% for p in prices %}<div class="f num" data-max="{{ t.price.max_width }}" style="left:{{ t.price.x }}px; top:{{ t.price_y[loop.index0] }}px">{{ p }}</div>
{% endfor %}
<div class="f meta" style="left:{{ t.date.x }}px; top:{{ t.date.y }}px; font-size:{{ t.date.font_size }}px">{{ date }}</div>
<div class="f meta" style="left:{{ t.time.x }}px; top:{{ t.time.y }}px; font-size:{{ t.time.font_size }}px">{{ time }}</div>
<script>
document.fonts.ready.then(() => {
  document.querySelectorAll(".num").forEach((el) => {
    let size = parseFloat(getComputedStyle(el).fontSize);
    while (el.getBoundingClientRect().width > Number(el.dataset.max) && size > 20) { size -= 1; el.style.fontSize = size + "px"; }
  });
  document.body.dataset.ready = "1";
});
</script>
</body>
</html>
